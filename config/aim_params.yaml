aim_node:
  ros__parameters:
    use_sim_time: true

    # 指令发布频率（手册建议 50 Hz）
    control_rate: 50.0

    # 到位判定允许的最大角度误差（rad），远处会自动收紧
    aim_tolerance: 0.02

    # 观测时间戳之外额外补偿的通信/执行延迟（s）
    extra_latency: 0.02

    # 运动拟合窗口（s）与平移拟合窗口（s）
    fit_window: 0.35
    trans_window: 0.20
    max_history: 45

    # 旋转角速度死区（rad/s），低于该值视为静止靶
    omega_deadband: 0.3

    # 只有正对程度高于该值的装甲板才会被重新捕获
    # 侧对板（法向与视线近乎垂直）的命中面只有 1.3 cm 宽，命中率极低，必须排除
    facing_min: 0.5

    # 锁板时允许的最低正对程度，低于它才切到别的板
    facing_hold: 0.4

    # 锁板匹配半径（m），选中板与预测位置超出该值即视为换板/丢失
    plate_jump_gate: 0.20

    # 装甲灭灯/只剩侧对板时，仍按预测位置继续射击的宽限时长（s）
    # 灭灯只是不再发布，仿真仍遍历全部装甲做命中判定，继续打是有效的
    hold_grace: 0.30

    # 装甲列表整体为空时的宽限（s）：灭灯最长 50 ms，0.12 s 足够覆盖；
    # 超过它多半是目标已被击毁，再开枪只会拉低命中率
    hold_grace_empty: 0.12

    # 云台俯仰机械限位（rad，抬头为正），与 configs/default.cfg 一致
    pitch_min: -0.5236
    pitch_max: 0.3491
